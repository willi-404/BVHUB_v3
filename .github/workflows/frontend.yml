name: Frontend

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Tests
        working-directory: frontend
        run: pnpm test

      - name: Production build
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: frontend
        run: pnpm exec playwright test
        continue-on-error: false

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Validate shell scripts
        run: bash -n scripts/deploy-preview.sh scripts/setup-pocketbase.sh scripts/start-pocketbase.sh scripts/test-pocketbase-integration.sh

      - name: PocketBase integration tests
        run: PB_TEST_PORT=18101 ./scripts/test-pocketbase-integration.sh
