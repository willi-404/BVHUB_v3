name: Release Drafter and automatic patch releases

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calculate the draft without writing it to GitHub"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  classify_push:
    runs-on: ubuntu-slim
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Classify the push
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("kind", "manual")
              return
            }

            const commits = context.payload.commits ?? []
            let hasMergedPullRequest = commits.some((commit) => {
              const subject = (commit.message ?? "").split("\n")[0]
              return /^Merge pull request #\d+ from /.test(subject)
            })

            if (!hasMergedPullRequest) {
              for (const commit of commits) {
                const pullRequests = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: commit.id,
                    per_page: 100,
                  },
                )

                if (
                  pullRequests.some(
                    (pullRequest) =>
                      pullRequest.base.ref === "master" &&
                      Boolean(pullRequest.merged_at),
                  )
                ) {
                  hasMergedPullRequest = true
                  break
                }
              }
            }

            core.setOutput(
              "kind",
              hasMergedPullRequest ? "merge_request" : "direct",
            )

  update_release_draft:
    needs: classify_push
    if: needs.classify_push.result == 'success' && needs.classify_push.outputs.kind != 'direct'
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  auto_patch_release:
    needs: classify_push
    if: needs.classify_push.result == 'success' && needs.classify_push.outputs.kind == 'direct'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate the next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            echo 'release_tag=v0.0.1' >> "$GITHUB_OUTPUT"
            echo 'previous_tag=' >> "$GITHUB_OUTPUT"
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_commit="$(git rev-list -n 1 "$latest_tag")"
          if [[ "$latest_commit" == "$GITHUB_SHA" ]]; then
            echo "The current commit is already tagged by $latest_tag; skipping a duplicate release."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${latest_tag#v}"
          IFS=. read -r major minor patch <<< "$version"
          next_patch=$((patch + 1))
          echo "release_tag=v${major}.${minor}.${next_patch}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"

      - name: Publish the automatic patch release
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.RELEASE_TAG

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              core.info(`Release ${tag} already exists; skipping.`)
              return
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
              ...(process.env.PREVIOUS_TAG
                ? { previous_tag_name: process.env.PREVIOUS_TAG }
                : {}),
            })

            core.info(`Published ${release.data.html_url}`)
